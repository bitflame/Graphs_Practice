<!-- Django template: chat.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Agent Demo</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f2f5; padding: 20px; }
        #chatBox { width: 100%; max-width: 600px; margin: auto; }
        #messages { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; background: #fff; }
        .user { color: blue; margin: 5px 0; }
        .agent { color: green; margin: 5px 0; }
        #question { width: 80%; padding: 10px; }
        #askBtn { padding: 10px 15px; }
    </style>
</head>
<body>
<h2>AI Agent Demo (Mock)</h2>
<div id="chatBox">
    <div id="messages"></div>
    <input type="text" id="question" placeholder="Type your question here...">
    <button id="askBtn">Ask</button>
</div>

<script>
    const messagesDiv = document.getElementById('messages');
    const input = document.getElementById('question');
    const button = document.getElementById('askBtn');

    function addMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.className = sender;
        msgDiv.textContent = text;
        messagesDiv.appendChild(msgDiv);
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    async function askQuestion() {
        const question = input.value.trim();
        if (!question) return;
        addMessage("You: " + question, "user");
        input.value = "";

        try {
            const response = await fetch(`/ask/?q=${encodeURIComponent(question)}`);
            const data = await response.json();
            addMessage("Agent: " + data.answer, "agent");
        } catch (err) {
            addMessage("Error contacting the agent.", "agent");
        }
    }

    button.addEventListener('click', askQuestion);
    input.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') askQuestion();
    });
</script>
</body>
</html>
